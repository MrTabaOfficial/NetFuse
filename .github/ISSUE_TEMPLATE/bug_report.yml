name: Bug report
description: Something in NetFuse doesn't work as expected. For security problems, see SECURITY.md instead.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems:** please don't post them here; report them privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: NetFuse version
      description: Settings > About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: networks
    attributes:
      label: Your networks
      placeholder: "Ethernet (fibre) + Wi-Fi to iPhone hotspot"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on Combined mode
        2. Start a Steam download
        3. ...
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings > Logs > Open folder, then paste the relevant part of netfuse.log. Remove anything private.
      render: text
